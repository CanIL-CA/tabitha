<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		%sveltekit.head%
	</head>

	<!-- https://tailwindcss.com/docs/container -->
	<body data-sveltekit-preload-data="hover" class="grid h-screen grid-rows-[auto_1fr_auto]">
		<!-- why this extra div is advised: https://kit.svelte.dev/docs/project-structure#project-files-src -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
