# bun is left out until Dependabot can parse Bun 1.4's lockfile v2
# (https://github.com/dependabot/dependabot-core/issues/16026): every bun job fails with
# "Unsupported bun.lock 'lockfileVersion' 2". Until then, dependency advisories are caught by the
# monthly `bun audit` triage routine and upgraded by hand. When it's fixed, restore a weekly
# `package-ecosystem: bun` entry at `directory: /`, grouping minor and patch bumps by production
# vs. development so 14 workspaces don't produce 14 PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
