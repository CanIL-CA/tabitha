# Dependabot can't open security-update PRs for the bun ecosystem (version updates only), so these
# weekly version updates are what turn Dependabot alerts into PRs. Minor and patch bumps are grouped
# so 14 workspaces don't produce 14 PRs; each major bump still gets its own PR so its breaking
# changes get a separate review.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
