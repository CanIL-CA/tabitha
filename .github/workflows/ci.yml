name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The org's default GITHUB_TOKEN is read-only; jobs that comment on the PR request
# `pull-requests: write` for themselves rather than using a PAT.
permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 0: CHANGE SCOPE (decides which of Stage 2's heavy jobs actually need to run)
  # ============================================================================
  plan:
    name: 🧭 Determine CI Scope
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.plan.outputs.run_build }}
      run_quality: ${{ steps.plan.outputs.run_quality }}
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      run_windows_smoke: ${{ steps.plan.outputs.run_windows_smoke }}
      turbo_filter: ${{ steps.plan.outputs.turbo_filter }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Compute change scope
        id: plan
        run: bun scripts/ci/plan.ts

  # ============================================================================
  # STAGE 1: HARD BLOCKERS (Fast-Fail Gates)
  # ============================================================================
  security_compliance:
    name: 🛡️ Security & Compliance (Blocking)
    runs-on: ubuntu-latest
    outputs:
      philosophies: ${{ steps.check_philosophies.outcome }}
      cloudflare: ${{ steps.check_cloudflare.outcome }}
      storage: ${{ steps.check_storage.outcome }}
      badges: ${{ steps.check_badges.outcome }}
      philosophy_docs: ${{ steps.check_philosophy_docs.outcome }}
      md: ${{ steps.check_md.outcome }}
      a11y_names: ${{ steps.check_a11y_names.outcome }}
      cross_platform: ${{ steps.check_cross_platform.outcome }}
      github_actions: ${{ steps.check_github_actions.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Secret & Credential Leak Scan (Blocking)
        run: bun run check:secrets

      - name: Architectural Philosophy Verification
        id: check_philosophies
        run: bun run check:philosophies
        continue-on-error: true

      - name: Cloudflare Workers Configuration Audit
        id: check_cloudflare
        run: bun run check:cloudflare
        continue-on-error: true

      - name: Storage Hygiene & Cookie Security Audit
        id: check_storage
        run: bun run check:storage
        continue-on-error: true

      - name: README Badge & Version Sync Audit
        id: check_badges
        run: bun run check:badges
        continue-on-error: true

      - name: Philosophy Count Doc Sync Audit
        id: check_philosophy_docs
        run: bun run check:philosophy-docs
        continue-on-error: true

      - name: Markdown Specification Lint
        id: check_md
        run: bun run check:md
        continue-on-error: true

      - name: Accessible-Name Collision Audit
        id: check_a11y_names
        run: bun run check:a11y-names
        continue-on-error: true

      - name: Undeclared CLI Dependency Audit (changed packages, Blocking)
        run: bun run check:deps

      - name: Cross-Platform DX Tooling Audit
        id: check_cross_platform
        run: bun run check:cross-platform
        continue-on-error: true

      - name: GitHub Actions Token & Permissions Audit
        id: check_github_actions
        run: bun run check:github-actions
        continue-on-error: true

  production_build:
    name: 📦 Production Bundle Build (Blocking)
    needs: [plan]
    if: needs.plan.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Production Bundle Verification
        run: bunx turbo run build:ci ${{ needs.plan.outputs.turbo_filter }}

  preview_deploy:
    name: 🌐 Per-PR Preview Deploy
    needs: [plan, security_compliance, production_build]
    # Only PRs -- a push to main deploys production via Workers Builds. Each changed app gets its
    # own Worker Preview named `pr-<N>` on its production Worker, served at
    # `pr-<N>.<app>.tabitha.bible`, so concurrent PRs never overwrite each other's previews. A
    # Preview calls production sibling apps; a PR that changes an app-to-app contract is tested
    # locally instead. preview_cleanup.yml deletes the Previews when the PR closes. See
    # docs/decisions/0020-per-pr-worker-previews.md.
    if: github.event_name == 'pull_request' && needs.plan.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      # turbo's own dependency graph decides which apps actually deploy (a shared-package change
      # can affect more apps than turbo_filter's own package names suggest) -- this reads that
      # graph rather than re-deriving it, so it can never drift from what the next step actually
      # deploys. `--dry=json`'s first line is a plain-text turbo-version banner on some runs but
      # not others; `sed` finds the real JSON's opening brace regardless. Entries with `command:
      # "<NONEXISTENT>"` are non-app workspace packages (e.g. @tabitha/types) pulled into the graph
      # as dependencies -- they don't define deploy:preview themselves, so they're filtered out.
      - name: Determine Deployed Preview Apps
        id: deployed_apps
        run: |
          dry_run=$(bunx turbo run deploy:preview ${{ needs.plan.outputs.turbo_filter }} --dry=json 2>/dev/null)
          apps=$(echo "$dry_run" | sed -n '/^{/,$p' | jq -r '[.tasks[] | select(.task == "deploy:preview" and .command != "<NONEXISTENT>") | .package | sub("@tabitha/"; "")] | join(",")')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Build Changed Apps for Preview
        if: steps.deployed_apps.outputs.apps != ''
        run: bunx turbo run build:preview ${{ needs.plan.outputs.turbo_filter }}

      # Runs `wrangler preview` per app rather than `turbo run deploy:preview -- --name ...`:
      # turbo passes `--` args to every task in the graph, including each app's vite build. Every
      # app is attempted before the step fails, so one broken app doesn't hide the others' previews.
      - name: Deploy Changed Apps to Preview
        if: steps.deployed_apps.outputs.apps != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW_DEPLOY }}
          DEPLOYED_APPS: ${{ steps.deployed_apps.outputs.apps }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          failed=()
          for app in ${DEPLOYED_APPS//,/ }; do
            (cd "apps/$app" && bunx wrangler preview --name "$PREVIEW_NAME") || failed+=("$app")
          done
          if (( ${#failed[@]} )); then
            echo "::error::Preview deploy failed for: ${failed[*]}"
            exit 1
          fi

      # Replaces Cloudflare Workers Builds' own preview bot comment; Workers Builds' preview builds
      # are turned off on every Worker, since CI builds the Previews itself. Apps deployed by an
      # earlier push stay listed: their Previews remain live until the PR closes.
      - name: Post Preview Links Comment
        if: steps.deployed_apps.outputs.apps != ''
        uses: actions/github-script@v9
        env:
          DEPLOYED_APPS: ${{ steps.deployed_apps.outputs.apps }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- ci-preview-links -->'
            // www's production domain is the apex, so its Previews use a preview-only www host
            const host = (app) => app === 'www' ? 'www-pr.tabitha.bible' : `${app}.tabitha.bible`

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              })
              const existing = comments.find((c) => c.body.includes(marker))

              const previous = [...(existing?.body ?? '').matchAll(/^- \*\*([\w-]+)\*\*/gm)].map(m => m[1])
              const apps = [...new Set([...previous, ...process.env.DEPLOYED_APPS.split(',').filter(Boolean)])].sort()
              const links = apps.map(app => `- **${app}**: https://${process.env.PREVIEW_NAME}.${host(app)}`).join('\n')
              const body = `${marker}\n### 🌐 Preview Deployments\n\nPreviews call the production versions of other apps.\n\n${links}`

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                })
              }
            } catch (error) {
              core.warning(`Could not post preview links comment: ${error.message}`)
            }

  # ============================================================================
  # STAGE 2: PARALLEL TEST & QUALITY MATRIX (Runs after Blockers Pass)
  # ============================================================================
  typecheck:
    name: 🔍 Typecheck & Svelte Diagnostics
    needs: [plan, security_compliance, production_build]
    if: needs.plan.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck & Svelte Diagnostics
        id: typecheck
        run: bunx turbo run check ${{ needs.plan.outputs.turbo_filter }}
        continue-on-error: true

  eslint:
    name: 🔍 ESLint
    needs: [plan, security_compliance, production_build]
    if: needs.plan.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    outputs:
      eslint: ${{ steps.eslint.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: ESLint
        id: eslint
        run: bunx turbo run check:lint ${{ needs.plan.outputs.turbo_filter }}
        continue-on-error: true

  unit_tests:
    name: 🧪 Unit Tests & Coverage
    needs: [plan, security_compliance, production_build]
    if: needs.plan.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: In-Memory Unit Tests & Coverage Report
        id: coverage
        run: bun run test:coverage
        continue-on-error: true

  e2e_tests:
    name: 🎭 Playwright E2E Tests
    needs: [plan, security_compliance, production_build]
    if: needs.plan.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      # db:load only reads tools/databases/snapshots/ -- scoping this to that directory avoids
      # fetching tools/databases/raw/ (ETL migration inputs, unused in CI). Reads are anonymous
      # HTTPS GETs against db-migration-data's public r2.dev URL (see tools/databases/migrations/r2_sync.ts).
      - name: Fetch Database Snapshots (R2, scoped)
        run: bun run r2:pull -- snapshots
        working-directory: tools/databases

      - name: Bootstrap Local D1 SQLite Snapshots
        run: bun run db:load

      - name: Inspect D1 SQLite Storage Inventory
        run: |
          echo "=== 🗄️ D1 Miniflare Database Storage Inventory ==="
          ls -lh apps/*/.wrangler/state/v3/d1/miniflare-D1DatabaseObject/ 2>/dev/null || true

      - name: Cache Playwright Chromium
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium & System Dependencies
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        # Retries because `playwright install --with-deps` shells out to apt-get, which
        # occasionally hits a "Hash Sum mismatch" against a Google/Ubuntu mirror mid-sync --
        # unrelated to this repo. Each attempt reruns apt-get update from scratch, so it has
        # a real chance of landing on a different mirror node; backoff increases since this
        # can be a longer-lived stale-mirror window rather than a single blip.
        run: |
          for attempt in 1 2 3 4 5; do
            bun run test:e2e:install && exit 0
            echo "Attempt $attempt/5 failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install Playwright OS Dependencies on Cache Hit
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            bunx playwright install-deps chromium && exit 0
            echo "Attempt $attempt/5 failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: Execute Playwright End-to-End Suite
        id: e2e
        run: bun run test:e2e
        continue-on-error: true

      - name: Diagnose D1 State on Failure
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "=== ⚠️ Playwright E2E Failure Storage State ==="
          find apps/*/.wrangler -name "*.sqlite" -exec ls -lh {} + 2>/dev/null || true

      - name: Upload Playwright Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
            apps/*/.wrangler/state/v3/d1/miniflare-D1DatabaseObject/
          # These paths are diagnostic-only (Playwright's report/test-results dirs, D1 state) --
          # a passing run has nothing to upload, which is expected, not a problem to warn about.
          if-no-files-found: ignore
          retention-days: 7

  windows_dx_smoke:
    name: 🪟 Windows DX Smoke Test
    needs: [plan, security_compliance, production_build]
    if: needs.plan.outputs.run_windows_smoke == 'true'
    runs-on: windows-latest
    outputs:
      windows_smoke: ${{ steps.db_load.outcome }}
      windows_unit_tests: ${{ steps.unit_tests.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install SQLite3 CLI
        run: choco install sqlite -y --no-progress

      # Only this job needs a real `node` binary on PATH -- db_load.ts's Windows branch shells
      # out to it as a workaround for an unresolved Bun-on-Windows stdio bug (see ADR 0011).
      # Every other job runs entirely under Bun.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      # db:load only reads tools/databases/snapshots/ -- scoping this to that directory avoids
      # fetching tools/databases/raw/ (ETL migration inputs, unused in CI). Reads are anonymous
      # HTTPS GETs against db-migration-data's public r2.dev URL (see tools/databases/migrations/r2_sync.ts).
      - name: Fetch Database Snapshots (R2, scoped)
        run: bun run r2:pull -- snapshots
        working-directory: tools/databases

      - name: Load Local D1 SQLite Databases (db:load)
        id: db_load
        run: bun run db:load
        continue-on-error: true

      - name: DX Doctor Diagnostics
        run: bun run check:doctor

      # Windows-only test failures (e.g. a hardcoded forward-slash path assertion breaking on a
      # backslash-separated result) have otherwise only ever been caught by a developer manually
      # running this locally, sometimes long after the code that broke it merged.
      - name: Unit Tests
        id: unit_tests
        run: bun run test:unit
        continue-on-error: true

  # ============================================================================
  # STAGE 3: PR SUMMARY (Advisory Results Surfaced on the PR)
  # ============================================================================
  pr_summary_start:
    name: 📝 Post PR Advisory Summary (Running)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Post CI-Running Placeholder Comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ci-pr-summary -->'
            const body = `${marker}\n### 🔎 CI Advisory Summary\n\n⏳ CI is running — this comment will update with results once checks finish.`

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              })
              const existing = comments.find((c) => c.body.includes(marker))

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                })
              }
            } catch (error) {
              core.warning(`Could not post CI-running placeholder comment: ${error.message}`)
            }

  pr_summary:
    name: 📝 Post PR Advisory Summary
    if: always() && github.event_name == 'pull_request'
    needs: [plan, security_compliance, production_build, typecheck, eslint, unit_tests, e2e_tests, windows_dx_smoke]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Build & Upsert PR Summary Comment
        uses: actions/github-script@v9
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON)
            const marker = '<!-- ci-pr-summary -->'

            const icon = (outcome) => {
              if (outcome === 'success') return '✅'
              if (outcome === 'failure') return '⚠️'
              if (outcome === 'skipped') return '⏭️'
              return '❓'
            }

            const checks = [
              ['Architectural Philosophies', needs.security_compliance.outputs.philosophies],
              ['Cloudflare Workers Config Audit', needs.security_compliance.outputs.cloudflare],
              ['Storage & Cookie Hygiene', needs.security_compliance.outputs.storage],
              ['README Badge & Version Sync', needs.security_compliance.outputs.badges],
              ['Philosophy Count Doc Sync', needs.security_compliance.outputs.philosophy_docs],
              ['Markdown Lint', needs.security_compliance.outputs.md],
              ['Accessible-Name Collision Audit', needs.security_compliance.outputs.a11y_names],
              ['Cross-Platform DX Tooling Audit', needs.security_compliance.outputs.cross_platform],
              ['GitHub Actions Token & Permissions Audit', needs.security_compliance.outputs.github_actions],
              ['Typecheck & Svelte Diagnostics', needs.typecheck.outputs.typecheck],
              ['ESLint', needs.eslint.outputs.eslint],
              ['Unit Test Coverage', needs.unit_tests.outputs.coverage],
              ['Playwright E2E', needs.e2e_tests.outputs.e2e],
              ['Windows DX Smoke (db:load)', needs.windows_dx_smoke.outputs.windows_smoke],
              ['Windows Unit Tests', needs.windows_dx_smoke.outputs.windows_unit_tests],
            ]

            let body = `${marker}\n### 🔎 CI Advisory Summary\n\nThese checks are non-blocking and never stop a merge, but are worth a look.\n\n`

            if (needs.plan.outputs.reason) {
              body += `🧭 **Scope:** ${needs.plan.outputs.reason}\n\n`
            }

            if (needs.security_compliance.result === 'failure') {
              body += `🚫 **Blocking gate failed:** secret/dependency scan (\`security_compliance\`). Advisory checks below may not have run.\n\n`
            }
            if (needs.production_build.result === 'failure') {
              body += `🚫 **Blocking gate failed:** production build (\`production_build\`).\n\n`
            }

            body += '| Check | Result |\n|---|---|\n'
            for (const [name, outcome] of checks) {
              body += `| ${name} | ${icon(outcome)} ${outcome ?? 'did not run'} |\n`
            }

            const failed = checks.filter(([, outcome]) => outcome === 'failure')
            if (failed.length > 0) {
              const pr = context.payload.pull_request
              const participants = new Set([pr.user.login])
              for (const reviewer of pr.requested_reviewers || []) {
                participants.add(reviewer.login)
              }
              const mentions = [...participants].map((login) => `@${login}`).join(' ')
              body += `\n${mentions} — ${failed.length} advisory check(s) need a look: ${failed.map(([name]) => name).join(', ')}.`
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              })
              const existing = comments.find((c) => c.body.includes(marker))

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                })
              }
            } catch (error) {
              // Warn rather than fail so a token/API hiccup doesn't show as a hard failure.
              core.warning(`Could not post PR summary comment: ${error.message}`)
            }
